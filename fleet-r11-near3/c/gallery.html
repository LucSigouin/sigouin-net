<script>
(function(){
  var INTERVAL=10*1000, imgs=[].slice.call(document.querySelectorAll('figure img')), view=document.getElementById('view'),
      big=document.getElementById('big'), cur=-1, one=false;
  function meta(i){var f=imgs[i].closest('figure');return {name:f.querySelector('b').textContent, info:f.querySelector('figcaption').innerText.split('\n').pop()};}
  function show(i, keepOne){
    if(!imgs.length) return; cur=(i+imgs.length)%imgs.length;
    big.src=imgs[cur].dataset.full+'?t='+Date.now(); var m=meta(cur);
    document.getElementById('vname').textContent=m.name; document.getElementById('vmeta').textContent=m.info;
    view.classList.add('on'); if(!keepOne) setOne(false);
    try{sessionStorage.setItem('gallery-view', m.name+'|'+(one?1:0));}catch(e){}
  }
  function setOne(v){one=v; view.classList.toggle('one',one); document.getElementById('vzoom').textContent=one?'1:1 pixels':'fit'; }
  function close(){view.classList.remove('on'); cur=-1; try{sessionStorage.removeItem('gallery-view');}catch(e){}}
  imgs.forEach(function(im,i){im.addEventListener('click',function(){show(i);});});
  big.addEventListener('click',function(e){
    if(one){setOne(false);return;}
    var rx=e.offsetX/big.clientWidth, ry=e.offsetY/big.clientHeight; setOne(true);
    var sc=view.querySelector('.scroll'); sc.scrollLeft=rx*big.naturalWidth-sc.clientWidth/2; sc.scrollTop=ry*big.naturalHeight-sc.clientHeight/2;
    try{sessionStorage.setItem('gallery-view', meta(cur).name+'|1');}catch(e){}
  });
  document.getElementById('prev').onclick=function(){show(cur-1);};
  document.getElementById('next').onclick=function(){show(cur+1);};
  document.getElementById('close').onclick=close;
  document.addEventListener('keydown',function(e){
    if(!view.classList.contains('on')) return;
    if(e.key==='Escape') close(); else if(e.key==='ArrowRight') show(cur+1); else if(e.key==='ArrowLeft') show(cur-1);
  });
  // restore the viewer after a refresh
  try{var s=sessionStorage.getItem('gallery-view'); if(s){var p=s.split('|'), n=p[0];
    for(var i=0;i<imgs.length;i++){ if(meta(i).name===n){ show(i,true); if(p[1]==='1') setOne(true); break; } } } }catch(e){}
  // refresh by reload; while the viewer is open only the page underneath changes
  setTimeout(function(){location.reload();}, INTERVAL);
})();
</script>
